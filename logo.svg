<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090A10"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>
    <linearGradient id="novaNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="35%" stop-color="#4FACFE"/>
      <stop offset="70%" stop-color="#7F00FF"/>
      <stop offset="100%" stop-color="#E100FF"/>
    </linearGradient>
    <linearGradient id="coreGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38EF7D"/>
      <stop offset="100%" stop-color="#11998E"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="4"/>

  <!-- Cyber Grid / Starburst accent lines -->
  <circle cx="256" cy="256" r="180" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="8 12" opacity="0.3"/>
  <circle cx="256" cy="256" r="120" stroke="#C084FC" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.4"/>

  <!-- Nova Flare Core (Outer Glow) -->
  <path d="M256 64 L280 200 L416 224 L304 288 L352 424 L256 336 L160 424 L208 288 L96 224 L232 200 Z"
        fill="url(#novaNeon)" opacity="0.25" filter="url(#glow)"/>

  <!-- Main Hexagonal Cyber Shield -->
  <polygon points="256,90 396,170 396,334 256,414 116,334 116,170" 
           fill="none" stroke="url(#novaNeon)" stroke-width="6" filter="url(#glow)"/>

  <!-- NovaCode "N" Monogram with Code Brackets -->
  <!-- Left Bracket < -->
  <path d="M 180 190 L 140 256 L 180 322" fill="none" stroke="#00F2FE" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right Bracket > -->
  <path d="M 332 190 L 372 256 L 332 322" fill="none" stroke="#E100FF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Central Futuristic 'N' -->
  <path d="M 210 320 V 192 L 302 320 V 192" 
        fill="none" stroke="url(#novaNeon)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Energy Pulse Dots -->
  <circle cx="210" cy="192" r="7" fill="#00F2FE" filter="url(#glow)"/>
  <circle cx="302" cy="320" r="7" fill="#E100FF" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="5" fill="#FFFFFF" filter="url(#glow)"/>
</svg>

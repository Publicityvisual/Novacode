<svg width="600" height="200" viewBox="0 0 600 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#7F00FF" />
      <stop offset="100%" stop-color="#E100FF" />
    </linearGradient>
    <linearGradient id="cyberGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#E100FF" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="darkCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F111A" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#06070A" stop-opacity="0.95" />
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="5" y="5" width="590" height="190" rx="20" fill="url(#darkCard)" stroke="url(#neonGradient)" stroke-width="2" />

  <!-- Shield / Emblem Graphic -->
  <g transform="translate(45, 35)">
    <!-- Outer Hexagon Glow -->
    <polygon points="65,5 125,40 125,110 65,145 5,110 5,40" fill="none" stroke="url(#neonGradient)" stroke-width="3.5" filter="url(#glowEffect)" />
    <!-- Inner Hexagon -->
    <polygon points="65,15 115,45 115,105 65,135 15,105 15,45" fill="#131722" stroke="#00F2FE" stroke-width="1.5" stroke-dasharray="4 4" />
    <!-- Stylized Monogram N -->
    <path d="M40 95 L40 35 L50 35 L80 85 L80 35 L90 35 L90 95 L80 95 L50 45 L50 95 Z" fill="url(#neonGradient)" filter="url(#glowEffect)" />
    <!-- Core Pulse Point -->
    <circle cx="65" cy="65" r="4" fill="#00F2FE" filter="url(#glowEffect)" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(195, 45)">
    <!-- Main Title: NOVACODE -->
    <text x="0" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Outfit', 'Inter', sans-serif" font-size="52" font-weight="900" letter-spacing="4" fill="url(#neonGradient)" filter="url(#glowEffect)">NOVACODE</text>
    <!-- Subtitle: CLI & Autonomous Intelligence -->
    <text x="5" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="14" font-weight="700" letter-spacing="6" fill="#00F2FE" opacity="0.95">AUTONOMOUS AI SUITE</text>
    <!-- Version Tag -->
    <rect x="365" y="18" width="65" height="24" rx="6" fill="#181B26" stroke="#7F00FF" stroke-width="1.5" />
    <text x="397" y="34" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#E100FF">v5.0</text>
  </g>
</svg>
